<html lang="en">
<head>

<title>Echo Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(.145 .012 250);--sf:oklch(.175 .012 250);--s2:oklch(.21 .012 250);--fg:oklch(.93 .008 240);--mu:oklch(.64 .014 245);--fa:oklch(.45 .014 245);--hl:oklch(1 0 0/.08);--hs:oklch(1 0 0/.16);--pr:oklch(.83 .14 75);--pf:oklch(.17 .02 70);--pg:oklch(.83 .14 75/.35);--wn:oklch(.7 .14 42);--se:'Fraunces',Georgia,serif;--sa:'Hanken Grotesk',system-ui,'Segoe UI',Roboto,sans-serif;--mo:'IBM Plex Mono',ui-monospace,Consolas,monospace;--ea:cubic-bezier(.22,1,.36,1);--sb:env(safe-area-inset-bottom,0px)}
@property --a1{syntax:'<color>';inherits:true;initial-value:oklch(.22 .02 250)}
@property --a2{syntax:'<color>';inherits:true;initial-value:oklch(.18 .02 280)}
#amb{position:fixed;inset:-10%;z-index:0;pointer-events:none;opacity:.7;background:radial-gradient(circle at 22% 18%,var(--a1) 0,transparent 55%),radial-gradient(circle at 82% 78%,var(--a2) 0,transparent 58%);transition:--a1 1.6s ease,--a2 1.6s ease}
#main{position:relative;z-index:1}
.fxr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;max-width:600px}
.fxr button{height:36px;padding:0 14px;border:1px solid var(--hl);border-radius:999px;font:11px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);transition:border-color .18s,color .18s,transform .18s var(--ea)}
.fxr button:hover{border-color:var(--hs);color:var(--fg)}.fxr button:active{transform:scale(.97)}.fxr button.on{border-color:var(--pr);color:var(--pr)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;-webkit-text-size-adjust:100%;scrollbar-color:var(--hs) transparent;scrollbar-width:thin}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--sa);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button,a,input,select{outline:none}
:focus-visible{outline:1px solid var(--pr);outline-offset:3px}
input{font-size:max(16px,1em)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
em{font-style:italic}
.lbl{font:10px var(--mo);letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.sf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.press{transition:transform .18s var(--ea),background-color .18s var(--ea),color .18s var(--ea),border-color .18s var(--ea)}.press:active{transform:scale(.97)}
.glow{filter:drop-shadow(0 0 6px var(--pg))}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes viz{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{from{transform:scale(.6);opacity:.5}to{transform:scale(1.4);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.rise{animation:rise .26s var(--ea) both}
.spin-slow{animation:spin 60s linear infinite;transform-origin:center;transform-box:fill-box}
.ro{animation:spin 120s linear infinite;transform-origin:300px 300px;transform-box:view-box}
.spin-record{animation:spin 8s linear infinite}
.vb{transform-box:fill-box;transform-origin:center bottom;animation:viz 1.1s ease-in-out infinite;opacity:.55;transition:opacity .25s}
.pz.is-paused .spin-slow,.pz.is-paused .ro,.pz.is-paused .spin-record,.pz.is-paused .vb{animation-play-state:paused}
.pz.is-paused .vb{opacity:.2}
#viz.live .vb{animation:none;transform:none;opacity:.75}
@media(prefers-reduced-motion:reduce){.spin-slow,.ro,.spin-record,.vb,.rise,.ripple,.eq b{animation:none!important}.tc{transform:none!important}}

/* shell */
#rail{position:fixed;inset:0 auto 0 0;width:76px;z-index:30;display:none;flex-direction:column;align-items:center;gap:8px;border-right:1px solid var(--hl);padding:24px 0 96px;background:oklch(.145 .012 250/.78);backdrop-filter:blur(24px)}
.logo{display:grid;place-items:center;width:40px;height:40px;margin-bottom:24px}
.rn{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:8px 0;border-radius:6px;color:var(--mu)}
.rn:hover{color:var(--fg)}.rn.on{color:var(--pr)}.rn svg.i{width:18px;height:18px}
.rn span{font:9px var(--mo);letter-spacing:.14em;text-transform:uppercase}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hl);background:oklch(.145 .012 250/.78);backdrop-filter:blur(24px);padding:max(.5rem,env(safe-area-inset-top)) 16px .5rem}
#top .lbl{color:var(--fg)}#top .lbl b{color:var(--pr);font-weight:400}
#main{min-height:100dvh;padding-bottom:calc(176px + var(--sb))}
.hd{padding:32px 16px 24px}
.hd .r{margin-top:12px;display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:space-between;gap:12px}.hd .r:has(.ha .pill:nth-child(2)){flex-wrap:wrap}.hd .r>div:first-child{flex:1 1 0;min-width:0}.hd .ha .pill{height:40px;padding:0 16px;flex:none}
.hd h1{font:300 3rem/1 var(--se);letter-spacing:-.025em;max-width:100%}
.hd .m{font:12px var(--mo);letter-spacing:.05em;color:var(--mu);margin-top:16px}
.ha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{padding:0 8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;border:1px solid var(--hs);border-radius:999px;padding:0 20px;font-size:14px;transition:border-color .18s,color .18s,transform .18s var(--ea),opacity .18s}
.pill:hover{border-color:var(--pr);color:var(--pr)}.pill:active{transform:scale(.97)}.pill:disabled{opacity:.4;cursor:default}.pill:disabled:hover{border-color:var(--hs);color:inherit}
.pill.am{border-color:var(--pr);color:var(--pr)}.pill.wn{border-color:var(--wn);color:var(--wn)}
.pill.lg{height:48px;padding:0 24px}.pill.solid{background:var(--pr);border-color:var(--pr);color:var(--pf);font-weight:500}.pill.solid:hover{filter:brightness(1.08);color:var(--pf)}
body.v-orbit #mini{display:none}body.v-lib #topsearch{visibility:hidden}
.ddm{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:1px solid var(--hl);padding:0 16px;text-align:left;color:var(--mu)}.ddm .ddt{flex:1;font-size:13px}.ddm:hover{border-color:var(--hs)}
#dp{position:fixed;inset:auto 0 0;z-index:30;display:none;height:80px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:24px;border-top:1px solid var(--hl);background:oklch(.145 .012 250/.8);backdrop-filter:blur(24px);padding:0 24px}
.np1{display:flex;min-width:0;align-items:center;gap:12px;text-align:left}
.np1 img{width:48px;height:48px;border-radius:2px;object-fit:cover;flex:none;background:var(--s2)}
.np1>div{min-width:0}.bt{font:400 1rem var(--se);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ba{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tr{display:flex;align-items:center;justify-content:center;gap:4px}
.mb{position:relative;display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;color:var(--mu);transition:color .18s,border-color .18s,transform .18s var(--ea)}
.mb:hover{color:var(--fg)}.mb.on{color:var(--pr)}.mb:active{transform:scale(.94)}
.mb.big{width:48px;height:48px;border:1px solid var(--hs);color:var(--fg)}.mb.big:hover{border-color:var(--pr);color:var(--pr)}
.mb.big svg.i{width:20px;height:20px}.mb.big svg.i[class]{transform:none}
.o{position:absolute;right:9px;bottom:9px;font:700 9px var(--mo);font-style:normal}
.skr{display:flex;width:100%;align-items:center;gap:12px;font:11px var(--mo);color:var(--mu)}
.skr .tcur{width:40px;text-align:right}.skr .tdur{width:40px}.skr input{flex:1}
.rt{display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--mu)}.rt input{width:112px}.rt .pv{width:32px;font:11px var(--mo)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;cursor:pointer;--fill:0%;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--pr) var(--fill),oklch(1 0 0/.2) var(--fill))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:oklch(1 0 0/.2)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--pr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:var(--pr);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--pr)}
#mini{position:fixed;inset:auto 0 calc(64px + var(--sb));z-index:30;border-top:1px solid var(--hl);background:var(--sf)}
.mp{height:1px;background:var(--hl)}.mp i{display:block;height:1px;width:0;background:var(--pr)}
.mr{display:flex;align-items:center;gap:12px;padding:8px 12px}.mr .np1{flex:1}.mr .np1 img{width:40px;height:40px}.mr .bt{font-size:14px}
#tabs{position:fixed;inset:auto 0 0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hl);background:oklch(.145 .012 250/.82);backdrop-filter:blur(24px);padding-bottom:var(--sb)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;color:var(--mu)}
#tabs button.on{color:var(--pr)}#tabs svg.i{width:20px;height:20px}
#tabs span{font:9px var(--mo);letter-spacing:.12em;text-transform:uppercase}
@media(min-width:640px){.hd{padding:32px 32px 24px}.hd h1{font-size:4.5rem}.sec{padding:0 24px}}
@media(min-width:768px){
#rail{display:flex}#top,#mini,#tabs{display:none}#dp{display:grid}
#main{padding-left:76px;padding-bottom:112px}.hd{padding-top:56px}
#toast{bottom:112px!important}}
@media(min-width:1024px){.hd .r{flex-direction:row;align-items:flex-end;justify-content:space-between}}

/* logo + menu */
#tlogo{position:fixed;z-index:25;top:calc(max(.5rem,env(safe-area-inset-top)) + 2px);right:12px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:transform .18s var(--ea)}
#tlogo:active{transform:scale(.93)}#tlogo:hover svg{filter:drop-shadow(0 0 8px var(--pg))}#tlogo svg{width:38px;height:38px;transition:filter .2s}
#top{padding-right:64px}
#dw{position:fixed;inset:0;z-index:55;pointer-events:none}
#dw .scrim{position:absolute;inset:0;background:oklch(0 0 0/.55);opacity:0;transition:opacity .25s}
#dw aside{position:absolute;inset:0 auto 0 0;width:min(300px,84vw);display:flex;flex-direction:column;background:var(--sf);border-right:1px solid var(--hs);box-shadow:20px 0 60px oklch(0 0 0/.5);transform:translateX(-100%);transition:transform .3s var(--ea);padding-top:env(safe-area-inset-top)}
#dw.open{pointer-events:auto}#dw.open .scrim{opacity:1}#dw.open aside{transform:none}
.dwh{display:flex;align-items:center;gap:12px;padding:16px 12px 16px 20px;border-bottom:1px solid var(--hl)}.dwh svg{width:32px;height:32px;flex:none}.dwh .lbl{flex:1;color:var(--fg)}
.dwi{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 20px;text-align:left;font-size:15px;color:var(--fg);transition:background-color .18s}.dwi:hover{background:var(--s2)}.dwi.on{color:var(--pr)}
@media(min-width:768px){#tlogo{top:12px;right:24px}}
/* library bits */
.dwrap{padding:0 16px 24px}.dd{display:flex;align-items:center;gap:20px;border:1px solid var(--hl);padding:16px}
.dd svg{width:112px;height:112px;flex:none}.dd .dt{font:400 1.25rem/1.2 var(--se);margin-top:8px}.dd .ds{margin-top:8px;font-size:14px;color:var(--mu)}.dd .ds b{font-weight:400;color:var(--fg)}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:0 16px 16px}
.sr{grid-column:span 2;display:flex;gap:8px;align-items:center;height:44px;min-width:0;border-bottom:1px solid var(--hs);color:var(--mu)}
.sr:focus-within{border-color:var(--pr)}
.sr input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:max(16px,1em);min-width:0}.sr input::placeholder{color:var(--fa)}
select{height:44px;min-width:0;background:var(--bg);color:var(--mu);border:1px solid var(--hs);padding:0 12px;font:12px var(--mo);letter-spacing:.05em;text-transform:uppercase}
.vt{display:flex;height:44px;border:1px solid var(--hs);padding:4px}
.vt button{padding:0 12px;font:11px var(--mo);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.vt button.on{background:var(--s2);color:var(--pr)}
@media(min-width:640px){.dd{gap:24px}.dd svg{width:128px;height:128px}.dd .dt{font-size:1.5rem}.dwrap{padding:0 32px 24px}.tbar{display:flex;align-items:center;gap:12px;padding:0 32px 16px}.sr{grid-column:auto;flex:1}}
.list{border-top:1px solid var(--hl)}
.row{display:flex;align-items:center;gap:12px;padding:8px;min-height:60px;border-bottom:1px solid var(--hl);cursor:pointer;transition:background-color .2s}
.row:hover,.row.cur{background:var(--sf)}
.row.sub{padding-left:32px}
.cvw{position:relative;flex:none;width:44px;height:44px}.row.sub .cvw{width:36px;height:36px}
.cvw img{width:100%;height:100%;border-radius:2px;object-fit:cover;background:var(--s2);display:block}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:oklch(.145 .012 250/.6)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq b{width:2px;height:100%;background:var(--pr);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.2s}.eq b:nth-child(3){animation-delay:-.4s}.eq.ps b{animation-play-state:paused}
.tt{flex:1;min-width:0;text-align:left}
.t1{display:flex;align-items:center;gap:8px;min-width:0}
.t1 b{font:400 15px var(--se);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cur .t1 b{color:var(--pr)}
.t2{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:12px;color:var(--mu);min-width:0}
.t2 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:12px;height:12px;fill:currentColor;stroke:none;color:var(--mu);flex:none}
.vl{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font:10px var(--mo);letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.vl:hover{color:var(--fg)}.vl svg.i{width:12px;height:12px;transition:transform .2s}.vl.open svg.i{transform:rotate(180deg)}
.qc,.ch{display:inline-block;border:1px solid var(--hs);border-radius:2px;padding:1px 6px;font:10px var(--mo);letter-spacing:.06em;color:var(--mu);white-space:nowrap}
.qc.hi{color:var(--pr);border-color:oklch(.83 .14 75/.4)}.qc.low{color:var(--wn);border-color:oklch(.7 .14 42/.4)}
.ch{letter-spacing:.14em;text-transform:uppercase;font-size:9px;padding:0 5px;flex:none}
.qd,.du{display:none}.du{width:48px;text-align:right;font:12px var(--mo);color:var(--mu)}
.ac{display:flex;align-items:center;flex:none}
.k{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--mu);transition:.18s;flex:none}
.k:hover{color:var(--fg)}.k.on{color:var(--fg)}.k:active{transform:scale(.95)}
@media(min-width:640px){.qd,.du{display:block}.qm{display:none}.row{gap:16px}.row.sub{padding-left:40px}.t1 b{font-size:16px}}
.none{padding:16px 8px;font:400 1.25rem var(--se);color:var(--mu)}
.pop{position:fixed;z-index:60;width:224px;max-height:70vh;overflow-y:auto;background:var(--sf);border:1px solid var(--hs);padding:4px 0;box-shadow:0 20px 50px oklch(0 0 0/.6);animation:rise .2s var(--ea) both}
.pop p{padding:8px 12px 4px}.pop button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:14px}
.pop button:hover{background:var(--s2)}.pop .dg{color:var(--wn)}
#toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translateX(-50%);background:var(--s2);border:1px solid var(--hs);padding:8px 16px;font:12px var(--mo);z-index:70;max-width:90vw;text-align:center}
#drop{position:fixed;inset:0;z-index:80;background:oklch(.145 .012 250/.9);display:grid;place-items:center;padding:24px;pointer-events:none}
#drop>div{width:100%;max-width:48rem;height:100%;max-height:520px;border:1px dashed var(--pr);display:grid;place-content:center;text-align:center}
#drop b{font:400 1.9rem var(--se)}

/* playlists */
.pr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;width:100%;padding:20px 0;text-align:left;border-bottom:1px solid var(--hl);transition:transform .18s var(--ea)}
.pr:active{transform:scale(.995)}
.pr .n{font:12px var(--mo);color:var(--fa)}
.pr .cv3{display:flex;flex:none}.pr .cv3 img{width:44px;height:44px;border-radius:2px;border:1px solid var(--bg);margin-left:-16px;display:block}.pr .cv3 img:first-child{margin-left:0}
.pr .pn{display:flex;align-items:center;gap:16px;min-width:0}
.pr .pt{font:400 1.5rem var(--se);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .18s}.pr:hover .pt{color:var(--pr)}
.pr .pm{font:12px var(--mo);color:var(--mu)}
.pls{margin:0 16px;border-top:1px solid var(--hl)}
.back{padding:24px 16px 0}.back button{display:inline-flex;align-items:center;gap:8px;min-height:44px}.back button:hover{color:var(--fg)}
.pne{padding:16px 16px 0}.pne input{width:100%;background:none;border:0;border-bottom:1px solid var(--pr);color:var(--fg);font:300 3rem/1.1 var(--se);padding:0}
@media(min-width:640px){.pls{margin:0 32px}.back,.pne{padding-left:32px;padding-right:32px}.pr .pt{font-size:1.875rem}.pne input{font-size:4.5rem}}

/* cloud */
.csec{margin:0 16px;max-width:48rem;border-top:1px solid var(--hl);border-bottom:1px solid var(--hl)}
.cdl{display:grid;grid-template-columns:repeat(2,1fr)}
.cdl>div{border-left:1px solid var(--hl);padding:20px 8px 20px 12px}.cdl>div:nth-child(odd){border-left:0;padding-left:0}.cdl dd{margin-top:8px;font:14px var(--mo)}
.cb{padding:32px 0}.cpr{display:flex;justify-content:space-between;font:11px var(--mo);color:var(--mu)}.cpr span:first-child{letter-spacing:.18em;text-transform:uppercase}
.cbar{margin-top:12px;height:1px;background:var(--hs)}.cbar i{display:block;height:1px;width:0;background:var(--pr);filter:drop-shadow(0 0 6px var(--pg));transition:width .2s}
.cbt{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.cnote{margin-top:24px;max-width:28rem;font-size:14px;color:var(--mu)}
.cmsg{margin-top:16px;font:12px var(--mo);color:var(--mu);min-height:1em}
.cf{display:flex;flex-direction:column;gap:12px;max-width:22rem}.cf .sr{grid-column:auto;flex:none}
.tl{background:none;color:var(--mu);font:11px var(--mo);letter-spacing:.14em;text-transform:uppercase;margin-top:16px}.tl:hover{color:var(--fg)}
@media(min-width:640px){.csec{margin:0 32px}.cdl{grid-template-columns:repeat(4,1fr)}.cdl>div:nth-child(odd){border-left:1px solid var(--hl);padding-left:12px}.cdl>div:first-child{border-left:0;padding-left:0}}

/* welcome */
.wl{display:flex;min-height:70vh;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px}
.wb{display:grid;place-items:center;width:100%;max-width:48rem;border:1px dashed var(--hs);padding:80px 24px;text-align:center;transition:border-color .2s}.wb:hover{border-color:var(--pr)}.wb:hover .wu{color:var(--pr)}
.wb h1{margin-top:32px;font:300 2.25rem/1.15 var(--se)}

 else if(v==2)for(let i=0;i<49;i++)o+=`<circle cx="${14+(i%7)*12}" cy="${14+Math.floor(i/7)*12}" r="${(h>>(i%20))&1?1.8:.8}" fill="${F}" stroke="none"/>`;

function parseName(n){const b=clean(n.replace(/_/g,' ')),p=b.split(/\s+[-–—]\s+/);let ar='',t=b;if(p.length==2)[ar,t]=p;else if(p.length>2){ar=p[0];t=VW.test(p[p.length-1])?p[1]+' ('+p.slice(2).join(' - ')+')':p.slice(2).join(' - ')}return{title:t.replace(/^\d{1,3}[.\s-]+(?=\S)/,'')||b,artist:ar}}
const meta=s=>{const p=parseName(s.name);return{title:clean(s.title||p.title)||p.title,artist:clean(s.artist||p.artist)}};
const VW=/(live|remix|acoustic|unplugged|instrumental|demo|remaster(?:ed)?|radio edit|extended|club|cover|karaoke|studio|original|mix|edit|version)/i,VT=/\s[-–]\s*[^-–]*(live|remix|acoustic|demo|remaster\w*|version|mix|edit)[^-–]*$/i;
function ver(t){for(const x of t.match(/[(\[][^)\]]*[)\]]/g)||[])if(VW.test(x))return x.slice(1,-1).trim().slice(0,20);const d=t.match(VT);return d?d[0].replace(/^\s[-–]\s*/,'').trim().slice(0,20):'Original'}
const gk=s=>{const m=meta(s);return(m.title.replace(/[(\[][^)\]]*[)\]]/g,x=>VW.test(x)?'':x).replace(VT,'')+'|'+m.artist).toLowerCase().replace(/[^a-z0-9|]/g,'')};
const ext=s=>((s.blob.name||'').split('.').pop()||'').toLowerCase()||(s.blob.type||'').split('/').pop();
const isLL=s=>!!s.ll||['flac','wav','aiff','aif','x-flac','x-wav','wave'].includes(ext(s));
function qual(s){const e=ext(s),nm=s.ll?'ALAC':({mpeg:'MP3',mp3:'MP3','x-flac':'FLAC','x-wav':'WAV',wave:'WAV',mp4:'M4A','x-m4a':'M4A'}[e]||e.toUpperCase());
 const kb=s.dur?Math.round((s.blob.size-(s.tb||0))*8/s.dur/1000):0;
 if(isLL(s)){const hi=s.bps>16||s.sr>48000;return{t:nm+(s.bps&&s.sr?' '+s.bps+'/'+Math.round(s.sr/1000):''),lv:'hi',w:hi?'Hi-res lossless':'Lossless, no quality loss'}}
 const og=e=='opus'||e=='ogg',lo=og?80:128,low=kb&&kb<lo;
 return{t:nm+(kb?' ~'+kb:''),lv:low?'low':'',w:low?'Low quality: about '+kb+' kbps':'Lossy, about '+kb+' kbps'}}
const qc=s=>{const Q=qual(s);return`<span class="qc ${Q.lv}" title="${esc(Q.w)}">${esc(Q.t)}</span>`};
const cov=s=>{if(s.cover){if(!CU.has(s.id))CU.set(s.id,URL.createObjectURL(s.cover));return CU.get(s.id)}return sleeve(s.name,meta(s).title)};
const fmt=t=>isFinite(t)&&t>0?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const fmtT=sec=>{const m=Math.round(sec/60),h=Math.floor(m/60);return(h?h+' hr ':'')+(m%60)+' min'};
const sumD=l=>l.reduce((a,s)=>a+(s.dur||0),0);
const fsz=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':Math.round(b/1048576)+' MB';
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)};
const mood=s=>s.mood||s.amood||MOODS[hash(gk(s))%4];
function reps(l){const G=new Map();for(const s of l){const k=gk(s);if(!G.has(k))G.set(k,[]);G.get(k).push(s)}return[...G.values()].map(g=>g.find(s=>s.def)||g[0])}
const nav=(k,id=0)=>{closeSheet();closeMenu();closeMN();plEdit=0;plDel=0;view={k,id};q='';render();scrollTo(0,0)};
const fmtWhen=t=>{if(!t)return'Never';const d=new Date(t),n=new Date(),hm=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}),dy=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return dy==0?'Today, '+hm:dy==1?'Yesterday, '+hm:d.toLocaleDateString([],{day:'numeric',month:'short'})+', '+hm};

async function addFiles(fs){fs=Array.from(fs);let n=0,skip=0;const ad=[];toast('Importing…');
 for(const f of fs){if(!/^audio\//.test(f.type)&&!/\.(mp3|flac|wav|m4a|aac|ogg|opus)$/i.test(f.name))continue;
  const name=f.name.replace(/\.[^.]+$/,'');if(songs.some(s=>s.name==name&&s.blob.size==f.size)){skip++;continue}
  const t=await readTags(f);await put('songs',{name,blob:f,fav:false,added:Date.now()+n,tagged:2,dur:await dur(f),...t});n++;ad.push(name)}
 await load();render();const lo=songs.filter(s=>ad.includes(s.name)&&qual(s).lv=='low').length;toast(n?n+(n==1?' song added':' songs added')+(lo?' · '+lo+' low quality':''):skip?'Already in your library':'No audio files found');analyzeSongs()}
async function enrich(){const old=songs.filter(s=>s.tagged!=2);if(!old.length)return;
 for(const s of old){Object.assign(s,await readTags(s.blob),{tagged:2});if(!s.dur)s.dur=await dur(s.blob);await put('songs',s)}
 await load();render();bar()}

function filt(l){const t=q.trim().toLowerCase();l=t?l.filter(s=>(s.name+' '+(s.title||'')+' '+(s.artist||'')+' '+(s.album||'')).toLowerCase().includes(t)):[...l];const T=s=>meta(s).title,A=s=>meta(s).artist;
 if(sort=='title')l.sort((a,b)=>T(a).localeCompare(T(b)));else if(sort=='artist')l.sort((a,b)=>A(a).localeCompare(A(b)));else if(sort=='duration')l.sort((a,b)=>(a.dur||0)-(b.dur||0));else l.sort((a,b)=>b.added-a.added);return l}

// listening clock (real: minutes you actually listen, by hour)
function dayDial(){if(!CLKOPEN){const t0=CLK.reduce((a,b)=>a+b,0)/60;return`<div class="dwrap"><button class="ddm" data-a="clk" aria-expanded="false"><span class="lbl">Your listening clock</span><span class="ddt">${t0<5?'still blank':'tap to open'}</span>${I('down')}</button></div>`}const hr=new Date().getHours(),mins=CLK.map(s=>s/60),mx=Math.max(...mins),T=mins.reduce((a,b)=>a+b,0),has=T>=5,peak=mins.indexOf(mx);
 const cs=songs.find(x=>x.id==cur),md=h=>h<5||h>=22?'Night':h<9?'Devotional':h<17?'Pulse':'Calm',nm=md(hr);let L='';
 for(let h=0;h<24;h++){const r=mx?mins[h]/mx:0,len=6+r*30,on=h==hr;L+=`<line x1="60" y1="36" x2="60" y2="${36-len}" stroke="${on?'var(--pr)':'var(--mu)'}" stroke-opacity="${on?1:.25+r*.6}" stroke-width="3" stroke-linecap="round" transform="rotate(${h*15} 60 60)"${on?' class="glow"':''}/>`}
 let lb='';[0,6,12,18].forEach(h=>lb+=`<text x="${60+15*Math.sin(h*Math.PI/12)}" y="${63-15*Math.cos(h*Math.PI/12)}" text-anchor="middle" font-size="6" font-family="IBM Plex Mono" fill="var(--fa)">${h}</text>`);
 return`<div class="dwrap"><div class="dd"><svg viewBox="0 0 120 120" role="img" aria-label="Listening clock"><circle cx="60" cy="60" r="22" fill="none" stroke="var(--hl)"/>${L}${lb}</svg><div style="min-width:0"><div style="display:flex;justify-content:space-between;align-items:center"><p class="lbl">Your listening clock</p><button class="lbl" data-a="clk" aria-expanded="true" style="min-height:32px;padding:0 4px">hide</button></div>${has?`<p class="dt">You drift in <em>after ${peak%12||12}${peak>=12?'pm':'am'}</em>.</p><p class="ds">Right now feels like <b>${nm}</b>. ${cs&&mood(cs)==nm?'Your record agrees.':'Try the '+nm.toLowerCase()+' ring in Orbit view.'}</p>`:`<p class="dt">Your clock is <em>still blank</em>.</p><p class="ds">Play some music and this fills in with the hours you listen most.</p>`}</div></div></div>`}

// orbit view of the library: songs as dots on concentric mood rings
function orbitHtml(list){const rs=reps(list),cs=songs.find(x=>x.id==cur);orbQ=rs.map(s=>s.id);if(!rs.length)return`<p class="none">${q?'Nothing matches “'+esc(q)+'”.':'Nothing here.'}</p>`;let g='';
 MOODS.forEach((m,ri)=>{const r=110+ri*55,ring=rs.filter(s=>mood(s)==m);let d='';
  ring.forEach((s,i)=>{const a=i/ring.length*Math.PI*2+ri*.6+.3,x=300+r*Math.cos(a),y=300+r*Math.sin(a),act=cs&&gk(s)==gk(cs);
   if(act)for(let k=0;k<8;k++){const t=a-(k+1)*.045;d+=`<circle cx="${300+r*Math.cos(t)}" cy="${300+r*Math.sin(t)}" r="${5-k*.5}" fill="var(--pr)" opacity="${.5-k*.06}"/>`}
   d+=`<g class="od${act?' act':''}" data-orb="${s.id}" tabindex="0" role="button" aria-label="Play ${esc(meta(s).title)} by ${esc(meta(s).artist)}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle class="dt" cx="${x}" cy="${y}" r="4"/></g>`});
  g+=`<g><circle cx="300" cy="300" r="${r}" fill="none" stroke="var(--hl)"/><text x="300" y="${300-r-6}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" letter-spacing="2" fill="var(--fa)">${m.toUpperCase()}</text><g class="ro" style="animation-duration:${120+ri*40}s;animation-direction:${ri%2?'reverse':'normal'}">${d}</g></g>`});
 return`<div class="orb rise"><svg id="ob" class="os pz${audio.paused?' is-paused':''}" viewBox="0 0 600 600"><g id="osp" transform="rotate(${spin} 300 300)" style="cursor:grab">${g}</g></svg><p class="lbl hint">drag to spin · tap a dot to play</p><div class="oc"><img id="oci" alt="" hidden><p class="ot" id="oct"></p><p class="lbl" id="oca"></p></div></div>`}
function setOC(s){if(!$('oct'))return;$('oci').hidden=!s;if(s)$('oci').src=cov(s);$('oct').textContent=s?meta(s).title:'';$('oca').textContent=s?(meta(s).artist||''):''}

 document.body.appendChild(p);const r=btn.getBoundingClientRect();p.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-p.offsetHeight-8))+'px';p.style.left=Math.max(8,Math.min(r.right-224,innerWidth-232))+'px';

// ---------- auto mood: listen to each song (tempo, loudness, brightness) and place it on a ring ----------
const cl01=v=>Math.max(0,Math.min(1,v));
async function featOf(blob){
 let ab;try{ab=await(blob.size>12e6?blob.slice(0,12e6):blob).arrayBuffer()}catch(e){return null}

 for(let f=0;f<n;f++){let a=0,p=x[st+f*H];for(let i=0;i<H;i++){const v=x[st+f*H+i];a+=v*v;if((v>=0)!==(p>=0))zc++;p=v}rms[f]=Math.sqrt(a/H);sum+=rms[f]}

  let bi=0;for(let k=1;k<12;k++)if(B[k]>B[bi])bi=k;if(!B[bi])return fb();res([Math.round(Hh[bi]/B[bi]),Math.round(Math.min(55,Math.max(25,S[bi]/B[bi]*70)))])}catch(e){fb()}};
