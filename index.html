<style>
:root{--bg:oklch(.145 .012 250);--sf:oklch(.175 .012 250);--s2:oklch(.21 .012 250);--fg:oklch(.93 .008 240);--mu:oklch(.64 .014 245);--fa:oklch(.45 .014 245);--hl:oklch(1 0 0/.08);--hs:oklch(1 0 0/.16);--pr:oklch(.83 .14 75);--pf:oklch(.17 .02 70);--pg:oklch(.83 .14 75/.35);--wn:oklch(.7 .14 42);--se:'Fraunces',Georgia,serif;--sa:'Hanken Grotesk',system-ui,'Segoe UI',Roboto,sans-serif;--mo:'IBM Plex Mono',ui-monospace,Consolas,monospace;--ea:cubic-bezier(.22,1,.36,1);--sb:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

/* shell */

.pill:hover{border-color:var(--pr);color:var(--pr)}.pill:active{transform:scale(.97)}.pill:disabled{opacity:.4;cursor:default}.pill:disabled:hover{border-color:var(--hs);color:inherit}
.pill.am{border-color:var(--pr);color:var(--pr)}.pill.wn{border-color:var(--wn);color:var(--wn)}
.pill.lg{height:48px;padding:0 24px}.row{content-visibility:auto;contain-intrinsic-size:auto 60px}
.pill.solid{background:var(--pr);border-color:var(--pr);color:var(--pf);font-weight:500}.pill.solid:hover{filter:brightness(1.08);color:var(--pf)}

.np1>div{min-width:0}.bt{font:400 1rem var(--se);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ba{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tr{display:flex;align-items:center;justify-content:center;gap:4px}
.mb{position:relative;display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;color:var(--mu);transition:color .18s,border-color .18s,transform .18s var(--ea)}
.mb:hover{color:var(--fg)}.mb.on{color:var(--pr)}.mb:active{transform:scale(.94)}
.mb.big{width:48px;height:48px;border:1px solid var(--hs);color:var(--fg)}.mb.big:hover{border-color:var(--pr);color:var(--pr)}
.mb.big svg.i{width:20px;height:20px}.mb.big svg.i[class]{transform:none}
.o{position:absolute;right:9px;bottom:9px;font:700 9px var(--mo);font-style:normal}
.skr{display:flex;width:100%;align-items:center;gap:12px;font:11px var(--mo);color:var(--mu)}
.skr .tcur{width:40px;text-align:right}.skr .tdur{width:40px}.skr input{flex:1}
.rt{display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--mu)}.rt input{width:112px}.rt .pv{width:32px;font:11px var(--mo)}

input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:oklch(1 0 0/.2)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--pr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:var(--pr);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--pr)}
#mini{position:fixed;inset:auto 0 calc(64px + var(--sb));z-index:30;border-top:1px solid var(--hl);background:var(--sf)}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-content:center;justify-items:center;gap:20px;background:var(--bg);pointer-events:none;animation:spOut .5s ease 1.3s forwards}

@keyframes spOrb{from{opacity:0;transform:rotate(-300deg)}30%{opacity:1}to{opacity:1;transform:none}}

#top{padding-right:64px}

/* more pages */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:0 16px 24px}

.card{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}

.eqs{display:grid;gap:4px;margin-top:16px;max-width:30rem}.eqr{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:12px}.eqr .v{font:11px var(--mo);color:var(--mu);text-align:right}

// ---------- smart background folder scanner (filters out voice notes, ringtones, SFX, call recordings) ----------
const BAD_DIR=/(\/|^)(whatsapp\s*voice\s*notes|whatsapp\s*audio|call\s*recordings?|recordings?|sound\s*recorder|voice\s*recorder|voicenotes?|ringtones?|notifications?|alarms?|android\/(data|obb)|cache|\.thumbnails|stickers|sfx|sound\s*effects|telegram\s*audio|system|ui)(\/|$)/i;
const BAD_FILE=/^(ptt|aud)[-_]\d{6,}|^(rec|call|voice|record|recording|memo|vn|clip|audio)[-_\s]?\d+|(ringtone|notification|alarm|whatsapp|voice[-_\s]?note|sound[-_\s]?effect|\bsfx\b|beep|chime|click)/i;
const MIN_SONG_BYTES=350*1024; // 350 KB
let SCAN={on:0,cancel:0},SAVED_FOLDERS=[];

function preFilterAudio(file,relPath=''){
 if(!/^audio\//.test(file.type||'')&&!/\.(mp3|flac|wav|m4a|aac|ogg|opus)$/i.test(file.name))return'not_audio';
 if(relPath&&BAD_DIR.test(relPath))return'bad_dir';
 if(BAD_FILE.test(file.name)&&file.size<2*1048576)return'bad_name';
 if(file.size<MIN_SONG_BYTES)return'too_small';
 return null;
}

function updateScanBar(msg){

async function importSmart(entries,label='folder'){
 if(SCAN.on){toast('A scan is already running in the background');return}
 SCAN={on:1,cancel:0};
 let added=0,skippedJunk=0,dupes=0,done=0,total=entries.length;
 updateScanBar(`<b>Scanning ${esc(label)}</b> · 0/${total}`);
 const existing=new Set(songs.map(s=>s.name+'|'+s.blob.size));
 for(const item of entries){
  if(SCAN.cancel)break;
  done++;
  const f=item.file||item,rel=item.path||f.webkitRelativePath||f.name;
  const bad=preFilterAudio(f,rel);
  if(bad){if(bad!='not_audio')skippedJunk++;continue}
  const name=f.name.replace(/\.[^.]+$/,''),key=name+'|'+f.size;
  if(existing.has(key)||IGN.has(key)){dupes++;continue}
  // Stage 2: check real duration + tags so short clips/voice memos without tags are skipped
  const d=await dur(f);
  if(d>0&&d<30){skippedJunk++;continue}
  const t=await readTags(f);
  const hasMusicTags=!!(t.artist||t.album);
  if(d>0&&d<55&&!hasMusicTags){skippedJunk++;continue}
  if(d>1500&&!hasMusicTags){skippedJunk++;continue} // >25 min untagged recording
  await put('songs',{name,blob:f,fav:false,added:Date.now()+added,tagged:2,dur:d,...t});
  existing.add(key);added++;
  if(added==1||added%5==0){await load();if(view.k=='lib')render()}
  updateScanBar(`<b>Scanning ${esc(label)}</b> · ${added} song${added==1?'':'s'} added · ${skippedJunk} non-songs skipped (${done}/${total})`);
  await new Promise(r=>setTimeout(r,20)); // yield to UI so playback stays butter-smooth
 }
 SCAN.on=0;updateScanBar('');
 await load();render();
 if(added)analyzeSongs();
 toast(SCAN.cancel?`Scan stopped · ${added} songs added`:added?`Added ${added} song${added==1?'':'s'} · skipped ${skippedJunk} non-songs${dupes?' · '+dupes+' already in library':''}`:dupes?`All ${dupes} songs are already in your library (${skippedJunk} non-songs skipped)`:`No full songs found (${skippedJunk} non-song audio clips skipped)`);
}

async function collectDirEntries(dirHandle,prefix='',out=[]){
 for await(const [name,handle] of dirHandle.entries()){
  if(SCAN.cancel)break;
  const rel=prefix?prefix+'/'+name:name;
  if(handle.kind==='directory'){
   if(BAD_DIR.test(rel+'/'))continue; // skip junk directories immediately without opening them
   await collectDirEntries(handle,rel,out);
  }else if(handle.kind==='file'){
   if(/\.(mp3|flac|wav|m4a|aac|ogg|opus)$/i.test(name)){
    try{const f=await handle.getFile();out.push({file:f,path:rel})}catch(e){}
   }
  }
 }
 return out;
}

async function scanDirHandle(handle,silent=false){
 if(SCAN.on)return;
 try{
  const perm=await handle.queryPermission({mode:'read'});
  if(perm!=='granted'){
   if(silent)return false;
   const req=await handle.requestPermission({mode:'read'});
   if(req!=='granted'){toast('Folder access permission was denied');return false}
  }
  updateScanBar(`<b>Reading ${esc(handle.name)}</b> in background…`);
  const entries=await collectDirEntries(handle,'',[]);
  if(!entries.length){updateScanBar('');if(!silent)toast('No audio files found in '+handle.name);return true}
  await importSmart(entries,handle.name);
  return true;
 }catch(e){updateScanBar('');if(!silent)toast('Could not scan folder: '+e.message);return false}
}

async function autoSyncFolders(){
 try{
  if(!fdb)await openFdb();
  if(!fdb)return;
  SAVED_FOLDERS=await rq(fst('folders','readonly').getAll());
  for(const f of SAVED_FOLDERS){

    const p=await f.handle.queryPermission({mode:'read'});
    if(p==='granted'){scanDirHandle(f.handle,true);break}
   }
  }

}
